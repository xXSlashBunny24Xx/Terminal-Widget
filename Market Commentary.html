<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Market Intelligence Terminal</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Source+Code+Pro:wght@400;500;600;700&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    
    <style>
        :root {
            /* --- TERMINAL PALETTE --- */
            --bg-app: #050505;
            --bg-header: #0a0a0a;
            --bg-row: #050505;
            --bg-row-hover: #0f0f0f;
            --bg-detail: #080808;
            
            --border-subtle: #1f1f1f;
            --border-accent: #333333;
            
            --text-primary: #ffffff;
            --text-secondary: #e5e5e5;
            --text-muted: #888888;
            
            --brand-orange: #ff6600;
            
            --bullish: #00e676; 
            --bearish: #ff1744; 
            --neutral: #9e9e9e;
        }

        /* --- RESET --- */
        * { box-sizing: border-box; }
        
        html, body {
            margin: 0;
            padding: 0;
            background-color: var(--bg-app);
            color: var(--text-primary);
            font-family: 'Inter', sans-serif;
            height: 100%;
            width: 100%;
            overflow: hidden;
            -webkit-font-smoothing: antialiased;
        }

        .app-container {
            display: flex;
            flex-direction: column;
            height: 100%;
            max-width: 1600px;
            margin: 0 auto;
            border-left: 1px solid var(--border-subtle);
            border-right: 1px solid var(--border-subtle);
        }

        /* --- HEADER --- */
        header {
            height: 56px;
            background-color: var(--bg-header);
            border-bottom: 1px solid var(--border-subtle);
            display: flex;
            align-items: center;
            justify-content: space-between; /* Keeps brand left */
            padding: 0 24px;
            flex-shrink: 0;
            z-index: 50;
        }

        .brand {
            font-family: 'Source Code Pro', monospace;
            font-weight: 700;
            font-size: 14px;
            letter-spacing: 1px;
            color: #fff;
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .brand::before {
            content: '';
            display: block;
            width: 8px;
            height: 8px;
            background-color: var(--brand-orange);
            border-radius: 50%;
            box-shadow: 0 0 8px var(--brand-orange);
        }

        /* --- FEED LIST --- */
        .feed-container {
            flex: 1;
            overflow-y: scroll;
            overflow-x: hidden;
            scroll-behavior: smooth;
        }

        /* --- DATE SEPARATOR --- */
        .date-separator {
            padding: 12px 24px;
            background-color: #0c0c0c;
            border-bottom: 1px solid var(--border-subtle);
            color: var(--brand-orange);
            font-family: 'Source Code Pro', monospace;
            font-size: 11px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 1px;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        
        .date-separator::before {
            content: '';
            display: block;
            width: 4px;
            height: 4px;
            background-color: var(--brand-orange);
            border-radius: 50%;
        }

        /* --- NEWS ITEM --- */
        .news-item {
            border-bottom: 1px solid var(--border-subtle);
            transition: background-color 0.2s ease;
        }

        .news-summary {
            display: flex;
            align-items: center;
            padding: 18px 24px;
            cursor: pointer;
            background-color: var(--bg-row);
            transition: background-color 0.3s;
        }

        /* FLASH ANIMATION FOR NEW ITEMS */
        @keyframes flashWhite {
            0% { background-color: #ffffff; }
            100% { background-color: var(--bg-row); }
        }

        .news-item.flash-new .news-summary {
            animation: flashWhite 2s ease-out;
        }

        .news-summary:hover {
            background-color: var(--bg-row-hover);
        }

        .news-item.active .news-summary {
            background-color: #0c0c0c;
            border-left: 3px solid var(--brand-orange);
            padding-left: 21px;
        }

        .time-badge {
            font-family: 'Source Code Pro', monospace;
            font-size: 12px;
            color: var(--text-muted);
            width: 80px;
            flex-shrink: 0;
        }

        .headline {
            font-size: 15px;
            font-weight: 600;
            color: var(--text-secondary);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            flex: 1;
            padding-right: 20px;
        }
        
        .news-item.bullish .news-summary { border-left: 3px solid var(--bullish); padding-left: 21px; }
        .news-item.bearish .news-summary { border-left: 3px solid var(--bearish); padding-left: 21px; }
        .news-item.neutral .news-summary { border-left: 3px solid var(--border-subtle); padding-left: 21px; }

        /* --- DETAIL AREA --- */
        .news-detail {
            display: none;
            background-color: var(--bg-detail);
            padding: 32px 40px;
            border-bottom: 1px solid var(--border-subtle);
            animation: slideDown 0.2s ease-out;
        }

        .news-item.active .news-detail { display: block; }

        @keyframes slideDown {
            from { opacity: 0; transform: translateY(-10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .detail-headline {
            font-family: 'Inter', sans-serif;
            font-size: 24px;
            font-weight: 700;
            color: #fff;
            line-height: 1.3;
            margin-bottom: 24px;
            letter-spacing: -0.5px;
        }

        .pill-container {
            display: flex;
            gap: 12px;
            margin-bottom: 24px;
            align-items: center;
        }

        .pill {
            font-family: 'Source Code Pro', monospace;
            font-size: 10px;
            font-weight: 700;
            text-transform: uppercase;
            padding: 4px 10px;
            border-radius: 4px;
        }
        .pill.bullish { background: rgba(0, 230, 118, 0.1); color: var(--bullish); border: 1px solid rgba(0, 230, 118, 0.3); }
        .pill.bearish { background: rgba(255, 23, 68, 0.1); color: var(--bearish); border: 1px solid rgba(255, 23, 68, 0.3); }
        .pill.neutral { background: rgba(158, 158, 158, 0.1); color: var(--text-muted); border: 1px solid rgba(158, 158, 158, 0.3); }
        
        .label-pill {
            font-family: 'Source Code Pro', monospace;
            font-size: 10px;
            color: var(--brand-orange);
            font-weight: 700;
            text-transform: uppercase;
        }

        .analysis-text {
            font-size: 15px;
            line-height: 1.7;
            color: var(--text-secondary);
            margin-bottom: 40px;
            max-width: 900px;
            border-left: 2px solid var(--border-subtle);
            padding-left: 20px;
        }

        /* --- IMPACT GRID --- */
        .impact-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 40px;
            margin-bottom: 40px;
            padding-bottom: 40px;
            border-bottom: 1px dashed var(--border-subtle);
        }

        .grid-col h4 {
            font-family: 'Source Code Pro', monospace;
            font-size: 11px;
            color: var(--brand-orange);
            margin: 0 0 12px 0;
            text-transform: uppercase;
            letter-spacing: 1px;
            font-weight: 700;
        }

        .grid-col .geo-header {
            font-family: 'Source Code Pro', monospace;
            font-size: 11px;
            color: var(--brand-orange);
            margin: 20px 0 8px 0;
            text-transform: uppercase;
            letter-spacing: 1px;
            font-weight: 700;
            display: block;
        }

        .grid-col p {
            font-size: 13px;
            line-height: 1.6;
            color: var(--text-secondary);
            margin: 0;
        }

        /* --- RISK CARDS --- */
        .risk-container {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 24px;
        }

        .risk-box {
            background: rgba(255, 255, 255, 0.02);
            padding: 20px;
            border-radius: 6px;
            border: 1px solid var(--border-subtle);
        }

        .risk-box h5 {
            margin: 0 0 10px 0;
            font-family: 'Source Code Pro', monospace;
            font-size: 11px;
            font-weight: 700;
            text-transform: uppercase;
        }
        .risk-box.upside h5 { color: var(--bullish); }
        .risk-box.downside h5 { color: var(--bearish); }

        .risk-box p {
            margin: 0;
            font-size: 13px;
            color: var(--text-secondary);
            line-height: 1.5;
        }

        .source-footer {
            margin-top: 40px;
            font-family: 'Source Code Pro', monospace;
            font-size: 11px;
            color: var(--text-muted);
            border-top: 1px solid var(--border-subtle);
            padding-top: 20px;
        }

        .source-content {
            background: #0a0a0a;
            padding: 12px;
            border-radius: 4px;
            border-left: 2px solid var(--border-subtle);
            color: #888;
            line-height: 1.4;
        }

        /* Loader */
        .loader-overlay {
            position: absolute;
            top: 56px; left: 0; width: 100%; height: 100%;
            background: var(--bg-app);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 100;
            transition: opacity 0.5s;
        }
        .spinner {
            width: 30px; height: 30px;
            border: 2px solid #333;
            border-top-color: var(--brand-orange);
            border-radius: 50%;
            animation: spin 1s infinite linear;
        }
        @keyframes spin { to { transform: rotate(360deg); } }

        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: var(--bg-app); }
        ::-webkit-scrollbar-thumb { background: #333; border-radius: 3px; }

        @media (max-width: 900px) {
            .impact-grid { grid-template-columns: 1fr; gap: 24px; }
            .risk-container { grid-template-columns: 1fr; }
        }
    </style>
</head>
<body>

    <div class="app-container">
        <header>
            <div class="brand">MARKET COMMENTARY</div>
            <!-- Clock Removed -->
        </header>

        <div class="feed-container" id="feed-container"></div>
        
        <div class="loader-overlay" id="loader">
            <div class="spinner"></div>
        </div>
    </div>

    <script>
        const API_URL = "https://script.google.com/macros/s/AKfycbysw5EuubTgdAx7qMWCCfW2M0bEUvumA0xT6I2sax49RcNeWQ1oDYRfyrT6wjT2CiJS/exec";

        const feedContainer = document.getElementById('feed-container');
        const loader = document.getElementById('loader');

        // State untuk melacak item yang sudah dilihat agar fitur Flash bekerja
        let seenItems = new Set();
        let firstLoad = true;

        function formatTime(dateString) {
            try {
                const date = new Date(dateString);
                if (isNaN(date.getTime())) return dateString.split(' ')[1] || dateString;
                return date.toLocaleTimeString('en-GB', { hour: '2-digit', minute: '2-digit' });
            } catch (e) { return dateString; }
        }
        
        function formatDateHeader(dateString) {
             try {
                const date = new Date(dateString);
                if (isNaN(date.getTime())) return "UNKNOWN DATE";
                return date.toLocaleDateString('en-GB', { weekday: 'long', day: 'numeric', month: 'long', year: 'numeric' });
            } catch (e) { return "DATE PARSE ERROR"; }
        }

        function getSentiment(text) {
            if (!text) return { type: 'neutral', label: 'NEUTRAL' };
            const lower = text.toLowerCase();
            if (lower.includes('risk-on') || lower.includes('bullish') || lower.includes('positive') || lower.includes('optimis')) 
                return { type: 'bullish', label: 'RISK-ON' };
            if (lower.includes('risk-off') || lower.includes('bearish') || lower.includes('negative') || lower.includes('pesimis')) 
                return { type: 'bearish', label: 'RISK-OFF' };
            return { type: 'neutral', label: 'NEUTRAL' };
        }

        async function fetchFeed() {
            try {
                const response = await fetch(API_URL);
                const result = await response.json();
                
                if (result.status === 'success') {
                    renderFeed(result.data);
                }
            } catch (error) {
                console.error("Feed Error:", error);
            } finally {
                if (firstLoad) {
                    loader.style.opacity = '0';
                    setTimeout(() => { loader.style.display = 'none'; }, 500);
                    firstLoad = false;
                }
            }
        }

        function renderFeed(items) {
            feedContainer.innerHTML = ''; 
            
            let lastDateStr = null;
            let currentSeen = new Set();

            items.forEach((item, index) => {
                const analysis = item.analysis;
                const sentiment = getSentiment(analysis.sentiment_impact);
                
                // --- 1. DATE SEPARATOR LOGIC ---
                const currentDateStr = formatDateHeader(item.date_published);
                if (currentDateStr !== lastDateStr) {
                    const sepEl = document.createElement('div');
                    sepEl.className = 'date-separator';
                    sepEl.textContent = currentDateStr;
                    feedContainer.appendChild(sepEl);
                    lastDateStr = currentDateStr;
                }

                // --- 2. FLASH NEW ITEM LOGIC ---
                // Buat ID unik berdasarkan waktu + judul
                const uniqueId = item.date_published + "_" + analysis.title;
                currentSeen.add(uniqueId);
                
                const isNew = !firstLoad && !seenItems.has(uniqueId);
                const flashClass = isNew ? 'flash-new' : '';

                // --- DATA MAPPING ---
                const policy = analysis.policy_impact || analysis.monetary_fiscal_policy_impact || "No data.";
                const market = analysis.market_impact || "No data available.";
                const eco = analysis.economic_impact || "No data.";
                const geo = analysis.geopolitical_impact || "None.";

                const itemEl = document.createElement('div');
                itemEl.className = `news-item ${sentiment.type} ${flashClass}`;
                
                itemEl.innerHTML = `
                    <div class="news-summary" onclick="toggleItem(this)">
                        <div class="time-badge">${formatTime(item.date_published)}</div>
                        <div class="headline">${analysis.title}</div>
                    </div>

                    <div class="news-detail">
                        
                        <div class="pill-container">
                            <span class="pill ${sentiment.type}">${sentiment.label}</span>
                            <span class="label-pill">KEY INSIGHT</span>
                        </div>
                        
                        <div class="detail-headline">${analysis.title}</div>
                        
                        <div class="analysis-text">
                            ${analysis.what_happen}
                        </div>

                        <div class="impact-grid">
                            <div class="grid-col">
                                <h4>ECONOMIC IMPACT</h4>
                                <p>${eco}</p>
                            </div>
                            <div class="grid-col">
                                <h4>POLICY IMPACT</h4>
                                <p>${policy}</p>
                                <span class="geo-header">GEOPOLITICS</span>
                                <p>${geo}</p>
                            </div>
                            <div class="grid-col">
                                <h4>MARKET IMPACT</h4>
                                <p>${market}</p>
                            </div>
                        </div>

                        <div class="risk-container">
                            <div class="risk-box upside">
                                <h5>UPSIDE SCENARIO</h5>
                                <p>${analysis.upside_risk}</p>
                            </div>
                            <div class="risk-box downside">
                                <h5>DOWNSIDE SCENARIO</h5>
                                <p>${analysis.downside_risk}</p>
                            </div>
                        </div>

                        <div class="source-footer">
                            <div style="margin-bottom:8px;">ORIGINAL CATALYST SOURCE:</div>
                            <div class="source-content">"${item.original_catalyst}"</div>
                        </div>

                    </div>
                `;

                feedContainer.appendChild(itemEl);
            });

            // Update state seenItems dengan item yang ada sekarang agar sync
            seenItems = currentSeen;
        }

        window.toggleItem = function(element) {
            const parent = element.parentElement;
            const isOpen = parent.classList.contains('active');
            
            document.querySelectorAll('.news-item').forEach(el => el.classList.remove('active'));

            if (!isOpen) {
                parent.classList.add('active');
                
                setTimeout(() => {
                    const headerHeight = 56;
                    const elementPosition = parent.getBoundingClientRect().top;
                    const offsetPosition = elementPosition + feedContainer.scrollTop - headerHeight;

                    feedContainer.scrollTo({
                        top: offsetPosition,
                        behavior: "smooth"
                    });
                }, 200);
            }
        }

        // Auto Refresh every 60 seconds (1 minute)
        setInterval(fetchFeed, 60000);
        
        // Initial Load
        fetchFeed();

    </script>
</body>
</html>
